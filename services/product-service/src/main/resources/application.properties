spring.application.name=product-service
spring.jpa.open-in-view=false
server.port=8081
server.shutdown=graceful
spring.docker.compose.enabled=false

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/product_service}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:checkout}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:checkout}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
logging.level.org.flywaydb=DEBUG

# Redis
spring.data.redis.url=${SPRING_DATA_REDIS_URL:redis://localhost:6379}

# Cache configuration
spring.cache.type=redis
cache:
  products:
    ttl-minutes: 10

# RabbitMQ
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.metrics.export.prometheus.enabled=true

# OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# Logging
logging.level.com.checkout.product=DEBUG
logging.pattern.level=%5p [${spring.application.name:},%X{X-Correlation-ID:-}]