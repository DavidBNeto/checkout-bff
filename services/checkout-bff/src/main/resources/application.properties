spring.application.name=checkout-bff
spring.jpa.open-in-view=false
server.shutdown=graceful
spring.docker.compose.enabled=false

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/checkout_bff}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:checkout}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:checkout}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true


# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Redis
spring.data.redis.url=${SPRING_REDIS_URL:redis://localhost:6379}

# RabbitMQ
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}

# Outbox Relay Configuration
outbox.relay.enabled=true
outbox.relay.poll-interval-ms=1000
outbox.relay.batch-size=100
outbox.relay.max-retries=5
outbox.relay.retry-delay-ms=5000

# Cache configuration
cache.products.ttl-minutes=10
cache.payment-methods.ttl-minutes=15
cache.cart.ttl-minutes=30

# External Services (disabled by default - using local DB)
product-service.enabled=true
product-service.base-url=${PRODUCT_SERVICE_URL:http://localhost:8081}
product-service.timeout-ms=3000
product-service.retry.max-attempts=3
product-service.retry.backoff-ms=500

payment-methods-service.enabled=true
payment-methods-service.base-url=${PAYMENT_METHODS_SERVICE_URL:http://localhost:8083}
payment-methods-service.timeout-ms=3000
payment-methods-service.retry.max-attempts=3
payment-methods-service.retry.backoff-ms=500

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.metrics.export.prometheus.enabled=true

# OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# Logging
logging.level.com.checkout.bff=DEBUG
logging.pattern.level=%5p [${spring.application.name:},%X{X-Correlation-ID:-}]
logging.level.org.flywaydb=DEBUG