# Test Configuration
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Enable external services for testing client beans
product-service.enabled=true
product-service.base-url=http://localhost:8081
product-service.timeout-ms=3000

payment-methods-service.enabled=true
payment-methods-service.base-url=http://localhost:8082
payment-methods-service.timeout-ms=3000

# Disable actuator endpoints for tests
management.endpoints.web.exposure.include=none

# Logging
logging.level.com.checkout.bff=DEBUG
logging.pattern.level=%5p [${spring.application.name:},%X{X-Correlation-ID:-}]