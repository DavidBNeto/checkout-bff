services:
  # Shared Infrastructure
  postgres:
    image: postgres:17-alpine
    container_name: checkout-postgres
    environment:
      POSTGRES_USER: checkout
      POSTGRES_PASSWORD: checkout
      POSTGRES_MULTIPLE_DATABASES: checkout_bff,product_service,payment_service
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U checkout -d checkout_bff"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - checkout-network

  redis:
    image: redis:8-alpine
    container_name: checkout-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - checkout-network

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: checkout-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - checkout-network

  # Product Service
  product-service:
    build:
      context: ./services/product-service
      dockerfile: Dockerfile
    container_name: checkout-product-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/product_service
      SPRING_DATASOURCE_USERNAME: checkout
      SPRING_DATASOURCE_PASSWORD: checkout
      SPRING_DATA_REDIS_URL: redis://redis:6379
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - checkout-network

  # Payment Service
  payment-service:
    build:
      context: ./services/payment-service
      dockerfile: Dockerfile
    container_name: checkout-payment-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payment_service
      SPRING_DATASOURCE_USERNAME: checkout
      SPRING_DATASOURCE_PASSWORD: checkout
      SPRING_DATA_REDIS_URL: redis://redis:6379
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - checkout-network

  # Checkout BFF
  checkout-bff:
    build:
      context: ./services/checkout-bff
      dockerfile: Dockerfile
    container_name: checkout-bff
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/checkout_bff
      SPRING_DATASOURCE_USERNAME: checkout
      SPRING_DATASOURCE_PASSWORD: checkout
      SPRING_DATA_REDIS_URL: redis://redis:6379
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      PRODUCT_SERVICE_ENABLED: "true"
      PRODUCT_SERVICE_URL: http://product-service:8081
      PAYMENT_METHODS_SERVICE_ENABLED: "true"
      PAYMENT_METHODS_SERVICE_URL: http://payment-service:8083
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      product-service:
        condition: service_started
      payment-service:
        condition: service_started
    networks:
      - checkout-network

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:

networks:
  checkout-network:
    driver: bridge
